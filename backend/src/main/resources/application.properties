spring.application.name=saathchalo
server.port=8080
server.error.include-message=never

# Database (override with environment variables in production)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/saathchalo}
spring.datasource.username=${DB_USER:saathchalo}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# Uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.mvc.problemdetails.enabled=true
logging.pattern.level=%5p [%X{requestId:-}]
management.endpoints.web.exposure.include=health
# The API documentation (Swagger) is only switched on in the dev profile.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# Behind the HTTPS proxy (Caddy): trust its X-Forwarded-* headers (only from private addresses) for the client's address.
server.forward-headers-strategy=native

# A generous ceiling against scraping and scripts (features keep their own, tighter limits).
app.limits.visitor-requests-per-minute=600
app.limits.member-changes-per-minute=120

# Security — JWT_SECRET must be set (at least 32 characters) outside the dev profile
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=saathchalo
app.jwt.access-token-ttl=30m
app.jwt.refresh-token-ttl=30d
app.auth.refresh-cookie-secure=true

# Phone OTP login
app.otp.ttl=5m
app.otp.max-attempts=5
app.otp.resend-cooldown=30s
app.otp.max-per-hour=5
app.otp.max-per-ip-per-hour=20
app.otp.expose-code=false
# console (development: written to the log), twilio, or smtp for email. A live server refuses to start with console
# unless ALLOW_CONSOLE_SENDERS=true (only for a private test server).
app.sms.provider=${SMS_PROVIDER:console}
app.email.provider=${EMAIL_PROVIDER:console}
app.launch.allow-console-senders=${ALLOW_CONSOLE_SENDERS:false}
# Twilio (SMS_PROVIDER=twilio). Indian numbers need DLT registration of the sender and message templates.
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from=${TWILIO_FROM:}
app.sms.twilio.messaging-service-sid=${TWILIO_MESSAGING_SERVICE_SID:}
# SMTP (EMAIL_PROVIDER=smtp): port 587 uses STARTTLS, 465 uses TLS. Plain, unencrypted connections are refused.
app.email.smtp.host=${SMTP_HOST:}
app.email.smtp.port=${SMTP_PORT:587}
app.email.smtp.username=${SMTP_USERNAME:}
app.email.smtp.password=${SMTP_PASSWORD:}
app.email.from=${EMAIL_FROM:}

app.storage.dir=${STORAGE_DIR:./data/uploads}

# Encrypts sensitive fields (2FA secrets, later licence numbers). Base64 of 32 random bytes; must be set outside dev.
app.security.data-key=${DATA_ENCRYPTION_KEY}
# The owner's phone number (+91…). The first time it logs in, it becomes super admin. Never commit a real number.
app.bootstrap.super-admin-phone=${SUPER_ADMIN_PHONE:}
app.staff.session-idle-timeout=15m
app.staff.session-max-age=8h
app.staff.totp-issuer=SaathChalo
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
# The website address, used in links sent by text message (e.g. SOS trip links).
app.public-url=${PUBLIC_URL:http://localhost:4200}

# Online payments (Phase 5). provider: none (off) | fake (development and tests only) | razorpay.
# Keys come from the environment; card and UPI details never reach SaathChalo.
app.payments.provider=${PAYMENTS_PROVIDER:none}
app.payments.service-fee-percent=0
app.payments.full-refund-hours=24
app.payments.late-cancel-refund-percent=50
app.payments.razorpay-key-id=${RAZORPAY_KEY_ID:}
app.payments.razorpay-key-secret=${RAZORPAY_KEY_SECRET:}
app.payments.razorpay-webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.payments.razorpayx-account-number=${RAZORPAYX_ACCOUNT_NUMBER:}

# Legal contact details shown on the Grievance officer page (IT Rules 2021 ask us to publish them). Blank until appointed.
app.legal.company=${LEGAL_COMPANY:}
app.legal.grievance-officer=${GRIEVANCE_OFFICER:}
app.legal.grievance-email=${GRIEVANCE_EMAIL:}
app.legal.address=${LEGAL_ADDRESS:}

# Promotions (Phase 10) are free up to and including this date (YYYY-MM-DD, India time). Blank = free.
# Set it to one month after launch. After it, new promotions can't be sent until paid promotions (with GST invoices) are built.
app.promotions.free-until=${PROMOTIONS_FREE_UNTIL:}

# Carpooling. Prices are rupees per seat for the whole route; the cap keeps rides cost-sharing, not commercial.
app.rides.suggested-price-per-km=2.0
app.rides.max-price-per-km=3.5
app.rides.min-price=20
app.rides.search-radius-km=30
app.rides.max-days-ahead=90
app.rides.request-ttl=12h
app.rides.payment-hold=15m
