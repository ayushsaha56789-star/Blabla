# Runs the backend tests, the frontend tests and a production build on every push to main and every pull request.
# It never deploys anything.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: saathchalo_test
          POSTGRES_USER: saathchalo
          POSTGRES_PASSWORD: saathchalo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saathchalo -d saathchalo_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Backend tests
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/saathchalo_test
        run: ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (no install scripts)
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Frontend tests
        working-directory: frontend
        run: npm test -- --watch=false
      - name: Production build
        working-directory: frontend
        run: npx ng build
